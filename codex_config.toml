model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
model_context_window = 1050000
model_auto_compact_token_limit = 630000
model_verbosity = "high"
file_opener = "none"
show_raw_agent_reasoning = true
sandbox_mode = "danger-full-access"
approval_policy = "never"
notify = ["codex-wakatime"]
model_instructions_file = "/Users/kainoa/Workspace/vimrc/codex_mcp_instructions.md"
personality = "pragmatic"
web_search = "live"
service_tier = "fast"

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"

[mcp_servers.chrome]
command = "npx"
args = ["chrome-devtools-mcp@latest", "--auto-connect"]

[features]
hooks = true
context_management = true

[mcp_servers.hindsight]
command = "node"
args = ["/Users/kainoa/.hindsight/coding-agents/dist/mcp-server.js"]
env = { HINDSIGHT_MCP_HARNESS = "codex" }
